apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
spec:
  interval: 5m0s
  path: ./podinfo
  prune: true
  sourceRef:
    kind: GitRepository
    name: podinfo
  targetNamespace: default
status:
  inventory:
    entries:
      - id: default_db-user-pass-abc1234567__Secret
        v: v1
